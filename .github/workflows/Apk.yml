name: Decompress ZIP and Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct download URL of the ZIP file"
        required: true
        type: string
      build_type:
        description: "Gradle task"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      java_version:
        description: "Java version"
        required: true
        default: "17"
        type: choice
        options:
          - "17"
          - "21"
          - "11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download ZIP
        run: |
          echo "Downloading ZIP from: ${{ inputs.zip_url }}"
          curl -L --fail --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0" \
            -o project.zip \
            "${{ inputs.zip_url }}"
          ls -lh project.zip

      - name: Decompress ZIP
        run: |
          mkdir -p extracted
          unzip -q project.zip -d extracted
          echo "=== Top-level structure ==="
          find extracted -maxdepth 2 -type d | head -40
          echo "==========================="

      - name: Locate Android project root
        id: find-root
        run: |
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found in the ZIP."
            echo "Looking for build.gradle files instead:"
            find extracted -name "build.gradle*" | head -20 || true
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Project root detected: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          chmod +x "$GRADLEW_PATH"

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          echo "Running: ./gradlew ${{ inputs.build_type }}"
          ./gradlew ${{ inputs.build_type }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
