name: Decompress ZIP and Build APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the ZIP file in the repository (relative to root)"
        required: true
        default: "project.zip"          # ← change this to your actual ZIP filename/path
        type: string
      build_type:
        description: "Gradle task"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      java_version:
        description: "Java version"
        required: true
        default: "17"
        type: choice
        options:
          - "17"
          - "21"
          - "11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f "${{ inputs.zip_path }}" ]; then
            echo "::error::ZIP file not found at: ${{ inputs.zip_path }}"
            echo "Files in the repository root:"
            ls -la
            exit 1
          fi
          echo "Found ZIP: ${{ inputs.zip_path }}"
          ls -lh "${{ inputs.zip_path }}"

      - name: Decompress ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ inputs.zip_path }}" -d extracted
          
          echo "=== Structure after unzip ==="
          find extracted -maxdepth 3 -type d | head -40
          echo "============================="

      - name: Locate Android project root
        id: find-root
        run: |
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found inside the ZIP."
            echo "Available build.gradle files:"
            find extracted -name "build.gradle*" | head -20 || true
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          chmod +x "$GRADLEW_PATH"

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          echo "Running: ./gradlew ${{ inputs.build_type }}"
          ./gradlew ${{ inputs.build_type }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
