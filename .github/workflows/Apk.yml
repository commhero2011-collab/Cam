name: Decompress ZIP and Build APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the ZIP file in the repository"
        required: true
        default: "Project.zip"
        type: string
      build_type:
        description: "Gradle task"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      java_version:
        description: "Java version"
        required: true
        default: "17"
        type: choice
        options:
          - "17"
          - "21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f "${{ inputs.zip_path }}" ]; then
            echo "::error::ZIP file not found at: ${{ inputs.zip_path }}"
            ls -la
            exit 1
          fi
          echo "Found ZIP: ${{ inputs.zip_path }}"
          ls -lh "${{ inputs.zip_path }}"

      - name: Decompress ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ inputs.zip_path }}" -d extracted
          echo "=== Structure after unzip ==="
          find extracted -maxdepth 3 -type d | head -40
          echo "============================="

      - name: Locate project root
        id: find-root
        run: |
          # Prefer the folder that contains settings.gradle.kts / settings.gradle
          PROJECT_ROOT=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find settings.gradle(.kts)"
            find extracted -name "*.gradle*" | head -20
            exit 1
          fi
          
          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate Gradle Wrapper (missing in ZIP)
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          # The ZIP only has gradle-wrapper.properties, not the actual gradlew scripts
          # Generate them using the Gradle version declared in the properties file
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          echo "Detected Gradle version: $GRADLE_VERSION"
          
          # Install Gradle temporarily just to generate the wrapper
          curl -sL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Build APK
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          echo "Running: ./gradlew ${{ inputs.build_type }}"
          ./gradlew ${{ inputs.build_type }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
