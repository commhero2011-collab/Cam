name: Decompress ZIP and Build APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the ZIP file in the repository"
        required: true
        default: "Project.zip"
        type: string
      build_type:
        description: "Gradle task"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      java_version:
        description: "Java version"
        required: true
        default: "17"
        type: choice
        options:
          - "17"
          - "21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f "${{ inputs.zip_path }}" ]; then
            echo "::error::ZIP file not found at: ${{ inputs.zip_path }}"
            ls -la
            exit 1
          fi
          echo "Found ZIP: ${{ inputs.zip_path }}"
          ls -lh "${{ inputs.zip_path }}"

      - name: Decompress ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ inputs.zip_path }}" -d extracted

      - name: Locate project root
        id: find-root
        run: |
          PROJECT_ROOT=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find settings.gradle(.kts)"
            exit 1
          fi
          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      - name: Fix Kotlin DSL compilation error
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          # Fix the "Unresolved reference: net" error in app/build.gradle.kts
          sed -i 's|java\.net\.URI(u)\.toURL()|java.net.URI.create(u).toURL()|g' app/build.gradle.kts
          # Alternative safer version if the above is not enough:
          sed -i 's|as java\.net\.HttpURLConnection|as java.net.HttpURLConnection|g' app/build.gradle.kts
          
          echo "=== Fixed line ==="
          grep -n "URI\|HttpURLConnection" app/build.gradle.kts || true

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          echo "Detected Gradle version: $GRADLE_VERSION"
          
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.find-root.outputs.project_root }}
        run: |
          ./gradlew ${{ inputs.build_type }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
